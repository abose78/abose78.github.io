<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} — Resume</title><meta name="description" content="Resume of {{NAME}}, {{TITLE}}.">
<link rel="preconnect" href="https://api.fontshare.com"><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=gambetta@500,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--paper:#fffdf9;--ink:#1c2430;--muted:#5d6672;--line:#e3ded4;--accent:#1f3a5f;--accent2:#c2763a}
*{box-sizing:border-box;min-width:0}body,li,dd,p{overflow-wrap:anywhere}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Satoshi,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,40px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}
h1{font-family:Gambetta,Georgia,serif;font-weight:600;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;margin:0;letter-spacing:-.01em}
.role{margin:8px 0 0;color:var(--accent);font-weight:500;font-size:1.1rem}
.contact{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.93rem}
.contact a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}.contact a:hover{color:var(--accent);border-color:var(--accent)}
.dl{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;text-decoration:none;padding:13px 20px;border-radius:10px;font-weight:700;transition:transform .15s,background .15s;white-space:nowrap}
.dl:hover{background:#16304f;transform:translateY(-1px)}.dl:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
.dl svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:32px 0}
.stat{background:var(--paper);padding:18px 16px}.stat b{display:block;font-family:Gambetta,Georgia,serif;font-size:1.9rem;color:var(--accent);line-height:1}.stat span{display:block;margin-top:6px;font-size:.85rem;color:var(--muted);line-height:1.35}
section{margin-top:40px}h2{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);margin:0 0 14px;font-weight:700}
.summary{font-size:1.08rem;max-width:68ch;margin:0}
.skills{display:grid;gap:10px;margin:0}.skill{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
dt{font-weight:700}dd{margin:0;color:var(--muted)}
.job{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px}
.job header{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
h3{margin:0;font-size:1.05rem;line-height:1.35}.org{margin:2px 0 0;color:var(--accent);font-weight:500}
time{color:var(--muted);font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.job ul{margin:12px 0 0;padding-left:1.1em}.job li{margin:4px 0;max-width:72ch}.job li::marker{color:var(--accent2)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.skill{grid-template-columns:1fr;gap:2px}.job header{flex-direction:column;gap:4px}.dl{width:100%;justify-content:center}}
@media print{.dl,footer{display:none}body{background:#fff}.job{border:0;padding:0}}
</style></head><body><main class="wrap">
<div class="top"><div><h1>{{NAME}}</h1><p class="role">{{TITLE}}</p>
<ul class="contact">{{CONTACT}}</ul></div>
<a class="dl" href="./Arindam_Bose_Resume.docx" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>Download Word resume</a></div>
{{STATS}}
<section><h2>Summary</h2><p class="summary">{{SUMMARY}}</p></section>
<section><h2>Technical skills</h2><dl class="skills">{{SKILLS}}</dl></section>
<section><h2>Experience</h2>{{JOBS}}</section>
<section><h2>Education</h2>{{EDU}}</section>
<footer><span>© 2026 {{NAME}}</span><a href="./Arindam_Bose_Resume.docx" download style="color:var(--accent)">Download resume (.docx)</a></footer>
</main></body></html>
